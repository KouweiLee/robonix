# Scheduler configuration for the scheduling benchmark
# Install this to ~/.robonix/scheduler.yaml before running the benchmark
# (or merge with existing scheduler.yaml)

# Skill dependency mapping:
# When a skill is active, the scheduler boosts all listed components.
skill_dependencies:
  # Navigation benchmark: boost path planner + localization + SLAM
  skl::bench_nav:
    - prm::base.navigate
    - prm::base.pose.cov
    - srv::bench_slam
    - skl::bench_nav

  # VLA grasping benchmark: boost cameras + perception pipeline
  skl::bench_grasp:
    - prm::camera.rgb
    - prm::camera.depth
    - srv::bench_perception
    - skl::bench_grasp

  # Visual inspection: boost cameras + perception
  skl::bench_inspect:
    - prm::camera.rgb
    - prm::camera.depth
    - srv::bench_perception
    - skl::bench_inspect

  # Also keep existing skill configs for real robot operation
  skl::move_to_object:
    - prm::base.navigate
    - prm::base.pose.cov
    - srv::semantic_map
    - prm::camera.rgb
    - prm::camera.depth

  skl::wandering:
    - prm::base.navigate
    - prm::base.pose.cov

# Infrastructure processes to boost when any skill is active
infrastructure_patterns:
  - webots
  - Webots
  - webots_ros2
  - robot_launch

# GPU-using components (for xsched integration)
# These components' GPU workloads will be scheduled by xsched
xpu_components:
  - srv::bench_perception
  - skl::bench_grasp
  - skl::bench_inspect

# xsched GPU scheduler configuration
xsched:
  enabled: true
  xcli_path: "~/.robonix/bin/xcli"
  server_addr: "127.0.0.1"
  server_port: 50000
  high_priority: 10
  normal_priority: 0
