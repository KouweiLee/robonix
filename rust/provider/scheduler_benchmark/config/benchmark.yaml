# Benchmark configuration
# Adjust parameters based on your hardware and desired precision

output_dir: benchmark_results
settle_time: 3.0          # Seconds to let background workers stabilize
skill_init_time: 2.0      # Seconds to wait for skill process to initialize
skill_timeout: 600.0      # Max seconds to wait for a skill to complete
num_runs: 1               # Number of runs per skill per condition

# Background contention workers
# These run continuously during the benchmark, creating resource contention.
# std_name must match entries in scheduler.yaml for the scheduler to manage them.
background_workers:
  perception:
    rate_hz: 30.0      
    std_name: srv::bench_perception
  lidar_slam:
    rate_hz: 15.0
    std_name: srv::bench_lidar_slam
  speech:
    rate_hz: 4.0          # Background voice activity detection
    std_name: srv::bench_speech
  cpu_noise:
    rate_hz: 10.0         # Unexpected CPU noise (e.g. log compression)
    std_name: srv::bench_cpu_noise
  gpu_noise:
    rate_hz: 10.0         # Unexpected GPU noise (e.g. background inference)
    std_name: srv::bench_gpu_noise


# Benchmark skills
# Each skill runs sequentially. Background workers create contention.
skills:
  - name: "skl::bench_nav"
    module: scheduler_benchmark.skills.nav2_skill
    topic_prefix: /robot1/skill/bench_nav
    iterations: 150
    warmup: 20
    params:
      grid_size: 500      # Occupancy grid size for path planning
      scan_grid: 256      # Grid size for scan matching
    dependencies:
      - srv::bench_lidar_slam

  - name: "skl::bench_grasp"
    module: scheduler_benchmark.skills.vla_skill
    topic_prefix: /robot1/skill/bench_grasp
    iterations: 150
    warmup: 15
    params:
      image_size: 224     # Input image size
      layers: 12          # Transformer layers
      hidden: 768         # Hidden dimension
      seq_len: 256        # Sequence length
    dependencies:
      - srv::bench_perception

  - name: "skl::bench_inspect"
    module: scheduler_benchmark.skills.inspect_skill
    topic_prefix: /robot1/skill/bench_inspect
    iterations: 150
    warmup: 15
    params: {}
    dependencies:
      - srv::bench_perception
      - srv::bench_lidar_slam         # Needs location context and scan data
