# Robonix Scheduler Configuration
# Installed to ~/.robonix/scheduler.yaml by make install. Edit there to customize.

# Skill -> list of components (primitives/services) to boost when skill runs.
skill_dependencies:
  skl::move_to_object:
    - prm::base.navigate
    - prm::base.pose.cov
    - srv::semantic_map
    - prm::camera.rgb
    - prm::camera.depth
  skl::wandering:
    - prm::base.navigate
    - prm::base.pose.cov

# Process name patterns for simulation infrastructure (Webots, webots_ros2_driver).
infrastructure_patterns:
  - webots
  - Webots
  - webots_ros2
  - robot_launch
