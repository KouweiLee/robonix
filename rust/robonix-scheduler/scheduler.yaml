# Robonix Scheduler Configuration
# Installed to ~/.robonix/scheduler.yaml by make install. Edit there to customize.

# Skill -> list of components (primitives/services) to boost when skill runs.
skill_dependencies:
  skl::move_to_object:
    - prm::base.navigate
    - prm::base.pose.cov
    - srv::semantic_map
    - prm::camera.rgb
    - prm::camera.depth
  skl::wandering:
    - prm::base.navigate
    - prm::base.pose.cov
  # Benchmark skills (scheduler_benchmark package)
  skl::bench_nav:
    - prm::base.navigate
    - prm::base.pose.cov
    - srv::bench_slam
  skl::bench_grasp:
    - prm::camera.rgb
    - prm::camera.depth
    - srv::bench_perception
  skl::bench_inspect:
    - prm::camera.rgb
    - prm::camera.depth
    - srv::bench_perception

# Process name patterns for simulation infrastructure (Webots, webots_ros2_driver).
infrastructure_patterns:
  - webots
  - Webots
  - webots_ros2
  - robot_launch

# Components that use GPU (for xsched scheduling). Only these will receive GPU priority hints.
# Add std_name of capabilities/services that run inference on GPU (e.g. srv::semantic_map).
xpu_components: []

# xsched integration (optional). Set xcli_path to enable GPU scheduling via xsched.
xsched:
  enabled: true
  xcli_path: "~/.robonix/bin/xcli"  # Expand ~ to HOME. Use "xcli" to search PATH.
  server_addr: "127.0.0.1"
  server_port: 50000
  high_priority: 10
  normal_priority: 0
