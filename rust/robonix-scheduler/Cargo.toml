[package]
name = "robonix-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
ros2-client = {version = "0.8.2", features = ["pre-iron-gid"]}
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }
chrono = "0.4"
libc = "0.2"
hostname = "0.4"
futures = "0.3"
futures-util = "0.3"
